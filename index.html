<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>The Journey — IVF Expense Tracker</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#FAF7F2;
    --card:#FFFFFF;
    --ink:#2A2827;
    --ink-soft:#726B63;
    --ink-faint:#A39B90;
    --border:#E7E0D3;
    --sage:#7C8A72;
    --sage-dark:#5F6E56;
    --rose:#BD7F72;
    --belfast:#4F6D89;
    --belfast-soft:#E7EEF3;
    --greece:#2E8290;
    --greece-soft:#E1F0EF;
    --gold:#D9A55C;
    --danger:#B5544A;
    --radius:14px;
    --radius-sm:9px;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--bg);
    color:var(--ink);
    font-family:'Inter',system-ui,sans-serif;
    -webkit-font-smoothing:antialiased;
    min-height:100vh;
  }
  #app{max-width:640px;margin:0 auto;padding-bottom:100px;}
  h1,h2,h3,.serif{font-family:'Fraunces',serif;}
  .mono{font-family:'IBM Plex Mono',monospace;}
  .loading{padding:60px 20px;text-align:center;color:var(--ink-soft);font-family:'Fraunces',serif;font-size:18px;}

  /* Header */
  .app-header{
    position:sticky;top:0;z-index:20;background:var(--bg);
    padding:18px 18px 0 18px;border-bottom:1px solid var(--border);
  }
  .eyebrow{
    font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--sage-dark);
    font-weight:600;margin-bottom:2px;
  }
  .app-title{font-size:26px;font-weight:600;margin:0 0 14px 0;letter-spacing:-.01em;}
  .tabs{display:flex;gap:6px;overflow-x:auto;padding-bottom:10px;scrollbar-width:none;}
  .tabs::-webkit-scrollbar{display:none;}
  .tab{
    flex:0 0 auto;padding:8px 14px;border-radius:999px;border:1px solid var(--border);
    background:var(--card);color:var(--ink-soft);font-size:14px;font-weight:600;cursor:pointer;
    white-space:nowrap;transition:all .15s ease;
  }
  .tab[data-tab="dashboard"].active{background:var(--ink);border-color:var(--ink);color:#fff;}
  .tab.active[data-loc="Belfast"]{background:var(--belfast);border-color:var(--belfast);color:#fff;}
  .tab.active[data-loc="Greece"]{background:var(--greece);border-color:var(--greece);color:#fff;}
  .tab.active.other-loc{background:var(--rose);border-color:var(--rose);color:#fff;}
  .tab.add-tab{border-style:dashed;color:var(--ink-faint);}

  .main{padding:18px;}

  /* Buttons */
  .btn{
    font-family:'Inter',sans-serif;font-size:14px;font-weight:600;border-radius:10px;
    padding:10px 16px;border:1px solid var(--border);background:var(--card);color:var(--ink);
    cursor:pointer;transition:transform .1s ease;
  }
  .btn:active{transform:scale(.97);}
  .btn-primary{background:var(--ink);border-color:var(--ink);color:#fff;}
  .btn-ghost{background:transparent;border-color:transparent;color:var(--ink-soft);padding:8px 10px;}
  .btn-danger{background:transparent;border-color:transparent;color:var(--danger);padding:6px 8px;font-size:13px;}
  .btn-sm{padding:7px 12px;font-size:13px;}
  .btn-full{width:100%;}

  .fab{
    position:fixed;right:20px;bottom:24px;z-index:15;
    width:56px;height:56px;border-radius:50%;background:var(--sage-dark);color:#fff;
    display:flex;align-items:center;justify-content:center;font-size:28px;border:none;
    box-shadow:0 6px 18px rgba(42,40,39,.25);cursor:pointer;line-height:0;
  }
  .fab:active{transform:scale(.94);}

  /* Dashboard */
  .hero{padding:8px 2px 22px 2px;}
  .hero-label{font-size:13px;color:var(--ink-soft);font-weight:600;margin-bottom:6px;}
  .hero-totals{display:flex;flex-wrap:wrap;gap:22px;}
  .hero-total-num{font-size:38px;font-weight:600;line-height:1;}
  .hero-total-cur{font-size:12px;color:var(--ink-faint);margin-top:4px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;}
  .hero-sub{font-size:13px;color:var(--ink-soft);margin-top:10px;}

  .empty-state{
    text-align:center;padding:50px 20px;color:var(--ink-soft);border:1px dashed var(--border);
    border-radius:var(--radius);background:var(--card);
  }
  .empty-state h3{margin:0 0 6px 0;color:var(--ink);}
  .empty-state p{font-size:14px;margin:0 0 16px 0;}

  .section-title{
    font-size:13px;font-weight:700;text-transform:uppercase;letter-spacing:.08em;
    color:var(--ink-soft);margin:28px 0 12px 0;
  }

  /* Timeline (signature element) */
  .timeline-wrap{overflow-x:auto;padding:10px 2px 6px 2px;scrollbar-width:none;}
  .timeline-wrap::-webkit-scrollbar{display:none;}
  .timeline{display:flex;align-items:flex-end;gap:26px;position:relative;padding:10px 6px 0 6px;min-width:min-content;}
  .timeline::before{content:'';position:absolute;left:6px;right:6px;top:36px;height:1px;background:var(--border);}
  .tl-node{display:flex;flex-direction:column;align-items:center;flex:0 0 auto;width:88px;}
  .tl-dot{border-radius:50%;position:relative;z-index:2;border:3px solid var(--bg);}
  .tl-name{font-size:12px;font-weight:700;margin-top:8px;text-align:center;}
  .tl-date{font-size:10px;color:var(--ink-faint);margin-top:1px;}
  .tl-amt{font-size:11px;margin-top:3px;font-weight:600;}

  .loc-cards{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
  .loc-card{
    background:var(--card);border:1px solid var(--border);border-radius:var(--radius);
    padding:14px;cursor:pointer;border-left:4px solid var(--sage);
  }
  .loc-card-name{font-weight:700;font-size:15px;margin-bottom:4px;}
  .loc-card-amt{font-size:18px;font-weight:600;}
  .loc-card-sub{font-size:11px;color:var(--ink-faint);margin-top:2px;}

  .cat-bar-block{margin-bottom:16px;}
  .cat-bar-cur{font-size:12px;font-weight:700;color:var(--ink-soft);margin-bottom:8px;}
  .cat-bar-row{display:flex;align-items:center;gap:10px;margin-bottom:8px;}
  .cat-bar-label{width:130px;flex:0 0 auto;font-size:12.5px;color:var(--ink-soft);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .cat-bar-track{flex:1;background:var(--border);border-radius:6px;height:9px;overflow:hidden;}
  .cat-bar-fill{height:100%;border-radius:6px;}
  .cat-bar-amt{width:70px;flex:0 0 auto;text-align:right;font-size:12.5px;font-weight:600;}

  .reset-link{
    display:block;text-align:center;margin-top:36px;font-size:12.5px;color:var(--ink-faint);
    text-decoration:underline;cursor:pointer;background:none;border:none;width:100%;padding:10px;
  }

  /* Trip cards */
  .trip-card{
    background:var(--card);border:1px solid var(--border);border-radius:var(--radius);
    margin-bottom:14px;overflow:hidden;
  }
  .trip-head{display:flex;align-items:center;justify-content:space-between;padding:14px 16px;cursor:pointer;gap:10px;}
  .trip-head-left{min-width:0;}
  .trip-name{font-weight:700;font-size:16px;margin:0;}
  .trip-dates{font-size:12px;color:var(--ink-faint);margin-top:2px;}
  .trip-head-right{display:flex;align-items:center;gap:10px;flex:0 0 auto;}
  .trip-total-amt{font-weight:600;font-size:16px;}
  .chev{transition:transform .15s ease;color:var(--ink-faint);font-size:13px;}
  .chev.open{transform:rotate(180deg);}
  .trip-body{padding:0 16px 16px 16px;border-top:1px solid var(--border);}
  .trip-actions{display:flex;justify-content:flex-end;gap:4px;padding-top:10px;}

  .fixed-grid{display:flex;flex-direction:column;gap:8px;margin-top:12px;}
  .fixed-row{display:flex;align-items:center;justify-content:space-between;gap:10px;}
  .fixed-row label{font-size:13.5px;color:var(--ink-soft);flex:1;}
  .fixed-input-wrap{display:flex;align-items:center;background:var(--bg);border:1px solid var(--border);border-radius:8px;padding:0 8px;width:120px;}
  .fixed-input-wrap span{font-size:13px;color:var(--ink-faint);}
  .fixed-input-wrap input{
    border:none;background:transparent;padding:8px 4px;width:100%;font-family:'IBM Plex Mono',monospace;
    font-size:14px;text-align:right;color:var(--ink);
  }
  .fixed-input-wrap input:focus{outline:none;}
  .subtotal-row{display:flex;justify-content:space-between;padding-top:10px;margin-top:6px;border-top:1px dashed var(--border);font-size:13.5px;font-weight:700;}

  .spend-subtotal{display:flex;justify-content:space-between;align-items:center;margin-top:8px;}
  .spend-subtotal .amt{font-weight:700;font-size:14px;}
  .spend-list{margin-top:10px;display:flex;flex-direction:column;gap:8px;}
  .spend-row{display:flex;align-items:center;gap:8px;padding:9px 10px;background:var(--bg);border-radius:9px;}
  .spend-row-main{flex:1;min-width:0;}
  .spend-row-item{font-size:13.5px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .spend-row-meta{display:flex;align-items:center;gap:6px;margin-top:3px;}
  .spend-row-date{font-size:11px;color:var(--ink-faint);}
  .chip{font-size:10.5px;font-weight:700;padding:2px 8px;border-radius:999px;color:#fff;white-space:nowrap;}
  .spend-row-cost{font-family:'IBM Plex Mono',monospace;font-size:13.5px;font-weight:600;flex:0 0 auto;}
  .spend-row-actions{display:flex;gap:2px;flex:0 0 auto;}
  .icon-btn{background:none;border:none;color:var(--ink-faint);cursor:pointer;font-size:14px;padding:4px;}
  .icon-btn:hover{color:var(--ink);}

  .add-entry-btn{margin-top:12px;}
  .spend-form{background:var(--bg);border:1px solid var(--border);border-radius:10px;padding:12px;margin-top:12px;}
  .form-row{margin-bottom:10px;}
  .form-row label{display:block;font-size:12px;font-weight:700;color:var(--ink-soft);margin-bottom:4px;text-transform:uppercase;letter-spacing:.04em;}
  .form-row input,.form-row select{
    width:100%;padding:10px;border:1px solid var(--border);border-radius:8px;font-family:'Inter',sans-serif;
    font-size:14px;background:#fff;color:var(--ink);
  }
  .form-grid-2{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
  .form-btn-row{display:flex;gap:8px;margin-top:4px;}

  /* Modal */
  .modal-overlay{
    position:fixed;inset:0;background:rgba(42,40,39,.45);z-index:50;
    display:flex;align-items:flex-end;justify-content:center;
  }
  .modal{
    background:#fff;width:100%;max-width:640px;border-radius:20px 20px 0 0;padding:22px 20px 26px 20px;
    max-height:88vh;overflow-y:auto;
  }
  .modal h2{margin:0 0 16px 0;font-size:20px;}
  .modal-close{position:absolute;}

  @media (min-width:520px){
    .modal-overlay{align-items:center;}
    .modal{border-radius:20px;}
  }
</style>
</head>
<body>
<div id="app"><div class="loading">Loading your journey…</div></div>

<script>
(function(){
  const CURRENCY_SYMBOLS = { GBP:'£', EUR:'€', USD:'$' };
  const PALETTE = ['#7C8A72','#BD7F72','#4F6D89','#2E8290','#D9A55C','#8C6E9C','#A6763E','#5F6E56'];
  const FIXED_ITEMS = [
    {key:'flight1', label:'Flight 1'},
    {key:'flight2', label:'Flight 2'},
    {key:'accommodation', label:'Accommodation'},
    {key:'medication', label:'Medication'},
    {key:'tests', label:'Tests'},
    {key:'collectionTransfer', label:'Collection & Transfer'}
  ];
  const DEFAULT_CATEGORIES = [
    {name:'Food & Drink', color:'#BD7F72'},
    {name:'Transport', color:'#4F6D89'},
    {name:'Toiletries & Comfort', color:'#D9A55C'},
    {name:'Shopping', color:'#2E8290'},
    {name:'Medical extras', color:'#8C6E9C'},
    {name:'Other', color:'#7C8A72'}
  ];
  const STORAGE_KEY = 'ivf-tracker-state';

  let state = { locations:['Belfast','Greece'], trips:[], categories: JSON.parse(JSON.stringify(DEFAULT_CATEGORIES)) };
  let currentTab = 'dashboard';
  let expandedTrips = new Set();
  let modalState = { open:false, mode:'add', tripId:null, presetLocation:null };
  let spendUI = {}; // tripId -> {adding:bool, editingId:string|null}
  let saveTimeout = null;
  let loaded = false;

  const app = document.getElementById('app');

  function uid(){ return Date.now().toString(36)+Math.random().toString(36).slice(2,8); }
  function escapeHtml(s){
    return String(s==null?'':s).replace(/[&<>"']/g, function(c){
      return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];
    });
  }
  function todayISO(){ return new Date().toISOString().slice(0,10); }

  function locationColor(loc){
    if(loc==='Belfast') return 'var(--belfast)';
    if(loc==='Greece') return 'var(--greece)';
    return 'var(--rose)';
  }
  function locationSoft(loc){
    if(loc==='Belfast') return 'var(--belfast-soft)';
    if(loc==='Greece') return 'var(--greece-soft)';
    return '#F5E9E6';
  }
  function defaultCurrencyFor(loc){
    return 'GBP';
  }

  function fmt(amount, currency){
    const sym = CURRENCY_SYMBOLS[currency] || '';
    const n = amount || 0;
    return sym + n.toLocaleString('en-GB',{minimumFractionDigits:2,maximumFractionDigits:2});
  }

  function findTrip(id){ return state.trips.find(function(t){ return t.id===id; }); }
  function categoryByName(name){ return state.categories.find(function(c){ return c.name===name; }); }

  function fixedTotal(trip){
    return FIXED_ITEMS.reduce(function(s,f){ return s + (parseFloat(trip.fixedCosts[f.key])||0); }, 0);
  }
  function spendingTotal(trip){
    return trip.spending.reduce(function(s,e){ return s + (parseFloat(e.cost)||0); }, 0);
  }
  function tripTotal(trip){ return fixedTotal(trip) + spendingTotal(trip); }

  function tripsForLocation(loc){
    return state.trips.filter(function(t){ return t.location===loc; });
  }

  /* ---------- persistence (browser localStorage) ---------- */
  function saveState(){
    try{
      localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
    }catch(e){ console.error('Save failed', e); }
  }
  function saveStateDebounced(){
    clearTimeout(saveTimeout);
    saveTimeout = setTimeout(saveState, 500);
  }

  async function loadState(){
    try{
      const raw = localStorage.getItem(STORAGE_KEY);
      if(raw){
        const parsed = JSON.parse(raw);
        if(parsed && Array.isArray(parsed.trips)) state = parsed;
      }
    }catch(e){ /* nothing saved yet, or storage unavailable */ }
    if(!state.locations || !state.locations.length) state.locations = ['Belfast','Greece'];
    if(!state.categories || !state.categories.length) state.categories = JSON.parse(JSON.stringify(DEFAULT_CATEGORIES));
    state.trips.forEach(function(t){
      if(!t.fixedCosts) t.fixedCosts = {};
      FIXED_ITEMS.forEach(function(f){ if(t.fixedCosts[f.key]==null) t.fixedCosts[f.key]=0; });
      if(!t.spending) t.spending = [];
      if(!t.currency) t.currency = defaultCurrencyFor(t.location);
    });
    loaded = true;
    render();
  }

  /* ---------- calculations for dashboard ---------- */
  function grandTotalsByCurrency(){
    const totals = {};
    state.trips.forEach(function(t){
      totals[t.currency] = (totals[t.currency]||0) + tripTotal(t);
    });
    return totals;
  }
  function locationTotals(loc){
    const totals = {};
    tripsForLocation(loc).forEach(function(t){
      totals[t.currency] = (totals[t.currency]||0) + tripTotal(t);
    });
    return totals;
  }
  function categoryTotalsByCurrency(){
    const byCur = {};
    state.trips.forEach(function(t){
      byCur[t.currency] = byCur[t.currency] || {};
      t.spending.forEach(function(e){
        byCur[t.currency][e.category] = (byCur[t.currency][e.category]||0) + (parseFloat(e.cost)||0);
      });
    });
    return byCur;
  }

  /* ---------- rendering ---------- */
  function render(){
    if(!loaded){ app.innerHTML = '<div class="loading">Loading your journey…</div>'; return; }
    let html = renderHeader();
    html += '<main class="main">';
    html += currentTab==='dashboard' ? renderDashboard() : renderLocationTab(currentTab);
    html += '</main>';
    html += '<button class="fab" data-action="open-add-trip" aria-label="Add trip">+</button>';
    if(modalState.open) html += renderModal();
    app.innerHTML = html;
  }

  function renderHeader(){
    let tabs = '<div class="tab' + (currentTab==='dashboard'?' active':'') + '" data-action="switch-tab" data-tab="dashboard">Dashboard</div>';
    state.locations.forEach(function(loc){
      const isOther = loc!=='Belfast' && loc!=='Greece';
      tabs += '<div class="tab' + (currentTab===loc?' active':'') + (isOther?' other-loc':'') + '" data-loc="'+escapeHtml(loc)+'" data-action="switch-tab" data-tab="'+escapeHtml(loc)+'">'+escapeHtml(loc)+'</div>';
    });
    return '' +
      '<div class="app-header">' +
        '<div class="eyebrow">Expense tracker</div>' +
        '<h1 class="app-title serif">The Journey</h1>' +
        '<div class="tabs">'+tabs+'</div>' +
      '</div>';
  }

  function renderDashboard(){
    if(!state.trips.length){
      return '' +
        '<div class="empty-state">' +
          '<h3 class="serif">Your journey starts here</h3>' +
          '<p>Add your first trip to start tracking flights, accommodation, treatment costs and day-to-day spending.</p>' +
          '<button class="btn btn-primary" data-action="open-add-trip">Add a trip</button>' +
        '</div>';
    }

    const totals = grandTotalsByCurrency();
    const currencies = Object.keys(totals);
    let heroHtml = '<div class="hero"><div class="hero-label">Total spent so far</div><div class="hero-totals">';
    currencies.forEach(function(cur){
      heroHtml += '<div><div class="hero-total-num mono">'+fmt(totals[cur],cur)+'</div><div class="hero-total-cur">'+cur+'</div></div>';
    });
    heroHtml += '</div><div class="hero-sub">Across '+state.trips.length+' trip'+(state.trips.length===1?'':'s')+'</div></div>';

    // timeline
    const sorted = state.trips.slice().sort(function(a,b){ return (a.startDate||'').localeCompare(b.startDate||''); });
    const amounts = sorted.map(tripTotal);
    const maxA = Math.max.apply(null, amounts.concat([1]));
    const minA = Math.min.apply(null, amounts.concat([maxA]));
    let tlHtml = '<div class="section-title">Timeline</div><div class="timeline-wrap"><div class="timeline">';
    sorted.forEach(function(t){
      const amt = tripTotal(t);
      const size = maxA===minA ? 44 : Math.round(30 + ((amt-minA)/(maxA-minA))*34);
      tlHtml += '' +
        '<div class="tl-node" data-action="switch-tab" data-tab="'+escapeHtml(t.location)+'" style="cursor:pointer;">' +
          '<div class="tl-dot" style="width:'+size+'px;height:'+size+'px;background:'+locationColor(t.location)+';"></div>' +
          '<div class="tl-name">'+escapeHtml(t.name)+'</div>' +
          '<div class="tl-date">'+(t.startDate?formatDateShort(t.startDate):'—')+'</div>' +
          '<div class="tl-amt mono">'+fmt(amt,t.currency)+'</div>' +
        '</div>';
    });
    tlHtml += '</div></div>';

    // location cards
    let locHtml = '<div class="section-title">By location</div><div class="loc-cards">';
    state.locations.forEach(function(loc){
      const lt = locationTotals(loc);
      const curs = Object.keys(lt);
      const count = tripsForLocation(loc).length;
      const amtStr = curs.length ? curs.map(function(c){ return fmt(lt[c],c); }).join(' · ') : fmt(0,defaultCurrencyFor(loc));
      locHtml += '' +
        '<div class="loc-card" data-action="switch-tab" data-tab="'+escapeHtml(loc)+'" style="border-left-color:'+locationColor(loc)+';">' +
          '<div class="loc-card-name">'+escapeHtml(loc)+'</div>' +
          '<div class="loc-card-amt mono">'+amtStr+'</div>' +
          '<div class="loc-card-sub">'+count+' trip'+(count===1?'':'s')+'</div>' +
        '</div>';
    });
    locHtml += '</div>';

    // category breakdown
    const catTotals = categoryTotalsByCurrency();
    let catHtml = '<div class="section-title">By category</div>';
    Object.keys(catTotals).forEach(function(cur){
      const entries = Object.entries(catTotals[cur]).sort(function(a,b){ return b[1]-a[1]; });
      if(!entries.length) return;
      const max = Math.max.apply(null, entries.map(function(e){ return e[1]; }));
      catHtml += '<div class="cat-bar-block"><div class="cat-bar-cur">'+cur+'</div>';
      entries.forEach(function(pair){
        const cat = categoryByName(pair[0]);
        const color = cat ? cat.color : '#999';
        const pct = max ? Math.round((pair[1]/max)*100) : 0;
        catHtml += '' +
          '<div class="cat-bar-row">' +
            '<div class="cat-bar-label">'+escapeHtml(pair[0])+'</div>' +
            '<div class="cat-bar-track"><div class="cat-bar-fill" style="width:'+pct+'%;background:'+color+';"></div></div>' +
            '<div class="cat-bar-amt mono">'+fmt(pair[1],cur)+'</div>' +
          '</div>';
      });
      catHtml += '</div>';
    });
    if(!Object.values(catTotals).some(function(o){ return Object.keys(o).length; })){
      catHtml += '<div style="font-size:13px;color:var(--ink-faint);">No spending-money entries logged yet.</div>';
    }

    return heroHtml + tlHtml + locHtml + catHtml +
      '<button class="reset-link" data-action="reset-data">Reset all data</button>';
  }

  function formatDateShort(iso){
    if(!iso) return '';
    const d = new Date(iso+'T00:00:00');
    if(isNaN(d)) return iso;
    return d.toLocaleDateString('en-GB',{day:'numeric',month:'short'});
  }
  function formatDateRange(a,b){
    if(!a && !b) return 'No dates set';
    if(a && b) return formatDateShort(a)+' – '+formatDateShort(b);
    return formatDateShort(a||b);
  }

  function renderLocationTab(loc){
    const trips = tripsForLocation(loc);
    let html = '<div class="section-title">'+escapeHtml(loc)+'</div>';
    if(!trips.length){
      html += '' +
        '<div class="empty-state">' +
          '<h3 class="serif">No trips yet</h3>' +
          '<p>Add a trip to '+escapeHtml(loc)+' to start tracking its costs.</p>' +
          '<button class="btn btn-primary" data-action="open-add-trip" data-preset-location="'+escapeHtml(loc)+'">Add a trip</button>' +
        '</div>';
      return html;
    }
    trips.forEach(function(t){ html += renderTripCard(t); });
    return html;
  }

  function renderTripCard(trip){
    const isOpen = expandedTrips.has(trip.id);
    const total = tripTotal(trip);
    let html = '<div class="trip-card" id="trip-'+trip.id+'">';
    html += '' +
      '<div class="trip-head" data-action="toggle-trip" data-trip-id="'+trip.id+'">' +
        '<div class="trip-head-left">' +
          '<p class="trip-name">'+escapeHtml(trip.name)+'</p>' +
          '<div class="trip-dates">'+formatDateRange(trip.startDate,trip.endDate)+'</div>' +
        '</div>' +
        '<div class="trip-head-right">' +
          '<div class="trip-total-amt mono" id="trip-total-'+trip.id+'">'+fmt(total,trip.currency)+'</div>' +
          '<div class="chev'+(isOpen?' open':'')+'">▾</div>' +
        '</div>' +
      '</div>';

    if(isOpen){
      html += '<div class="trip-body">';

      // fixed costs
      html += '<div class="fixed-grid">';
      FIXED_ITEMS.forEach(function(f){
        const val = trip.fixedCosts[f.key] || 0;
        html += '' +
          '<div class="fixed-row">' +
            '<label>'+f.label+'</label>' +
            '<div class="fixed-input-wrap">' +
              '<span>'+CURRENCY_SYMBOLS[trip.currency]+'</span>' +
              '<input type="number" inputmode="decimal" step="0.01" class="fixed-cost-input" data-trip-id="'+trip.id+'" data-key="'+f.key+'" value="'+val+'">' +
            '</div>' +
          '</div>';
      });
      html += '<div class="subtotal-row"><span>Fixed costs subtotal</span><span class="mono" id="fixed-sub-'+trip.id+'">'+fmt(fixedTotal(trip),trip.currency)+'</span></div>';
      html += '</div>';

      // spending money
      html += '<div class="section-title" style="margin-top:22px;">Spending money</div>';
      html += '<div class="spend-subtotal"><span style="font-size:13px;color:var(--ink-soft);">Logged entries</span><span class="amt mono" id="spend-sub-'+trip.id+'">'+fmt(spendingTotal(trip),trip.currency)+'</span></div>';

      const sorted = trip.spending.slice().sort(function(a,b){ return (b.date||'').localeCompare(a.date||''); });
      if(sorted.length){
        html += '<div class="spend-list">';
        sorted.forEach(function(e){
          const cat = categoryByName(e.category);
          const color = cat ? cat.color : '#999';
          html += '' +
            '<div class="spend-row">' +
              '<div class="spend-row-main">' +
                '<div class="spend-row-item">'+escapeHtml(e.item)+'</div>' +
                '<div class="spend-row-meta">' +
                  '<span class="spend-row-date">'+formatDateShort(e.date)+'</span>' +
                  '<span class="chip" style="background:'+color+';">'+escapeHtml(e.category)+'</span>' +
                '</div>' +
              '</div>' +
              '<div class="spend-row-cost mono">'+fmt(parseFloat(e.cost)||0,trip.currency)+'</div>' +
              '<div class="spend-row-actions">' +
                '<button class="icon-btn" data-action="edit-spend" data-trip-id="'+trip.id+'" data-spend-id="'+e.id+'" title="Edit">✎</button>' +
                '<button class="icon-btn" data-action="delete-spend" data-trip-id="'+trip.id+'" data-spend-id="'+e.id+'" title="Delete">✕</button>' +
              '</div>' +
            '</div>';
        });
        html += '</div>';
      }

      const ui = spendUI[trip.id] || {};
      if(ui.adding){
        html += renderSpendForm(trip, ui.editingId);
      } else {
        html += '<button class="btn btn-sm add-entry-btn" data-action="add-spend-open" data-trip-id="'+trip.id+'">+ Add spending entry</button>';
      }

      html += '<div class="subtotal-row" style="border-top:1px solid var(--border);margin-top:16px;"><span>Trip total</span><span class="mono">'+fmt(total,trip.currency)+'</span></div>';

      html += '' +
        '<div class="trip-actions">' +
          '<button class="btn btn-ghost btn-sm" data-action="open-edit-trip" data-trip-id="'+trip.id+'">Edit trip</button>' +
          '<button class="btn btn-danger btn-sm" data-action="delete-trip" data-trip-id="'+trip.id+'">Delete trip</button>' +
        '</div>';

      html += '</div>'; // trip-body
    }
    html += '</div>'; // trip-card
    return html;
  }

  function renderSpendForm(trip, editingId){
    const entry = editingId ? trip.spending.find(function(e){ return e.id===editingId; }) : null;
    let catOptions = state.categories.map(function(c){
      return '<option value="'+escapeHtml(c.name)+'"'+(entry&&entry.category===c.name?' selected':'')+'>'+escapeHtml(c.name)+'</option>';
    }).join('');
    catOptions += '<option value="__new__">+ Add new category…</option>';

    return '' +
      '<div class="spend-form">' +
        '<div class="form-grid-2">' +
          '<div class="form-row"><label>Date</label><input type="date" class="sf-date" value="'+(entry?entry.date:todayISO())+'"></div>' +
          '<div class="form-row"><label>Cost ('+trip.currency+')</label><input type="number" inputmode="decimal" step="0.01" class="sf-cost" placeholder="0.00" value="'+(entry?entry.cost:'')+'"></div>' +
        '</div>' +
        '<div class="form-row"><label>Item</label><input type="text" class="sf-item" placeholder="e.g. Taxi to clinic" value="'+(entry?escapeHtml(entry.item):'')+'"></div>' +
        '<div class="form-row"><label>Category</label><select class="sf-category">'+catOptions+'</select></div>' +
        '<div class="form-btn-row">' +
          '<button class="btn btn-primary btn-sm" data-action="save-spend" data-trip-id="'+trip.id+'" data-spend-id="'+(editingId||'')+'">'+(editingId?'Save changes':'Add entry')+'</button>' +
          '<button class="btn btn-ghost btn-sm" data-action="cancel-spend" data-trip-id="'+trip.id+'">Cancel</button>' +
        '</div>' +
      '</div>';
  }

  function renderModal(){
    const editing = modalState.mode==='edit' ? findTrip(modalState.tripId) : null;
    const presetLoc = modalState.presetLocation;
    let locOptions = state.locations.map(function(l){
      const sel = editing ? editing.location===l : presetLoc===l;
      return '<option value="'+escapeHtml(l)+'"'+(sel?' selected':'')+'>'+escapeHtml(l)+'</option>';
    }).join('');
    locOptions += '<option value="__new__">+ Add new location…</option>';

    const currency = editing ? editing.currency : defaultCurrencyFor(presetLoc||state.locations[0]);
    let curOptions = ['GBP','EUR','USD'].map(function(c){
      return '<option value="'+c+'"'+(currency===c?' selected':'')+'>'+c+' ('+CURRENCY_SYMBOLS[c]+')</option>';
    }).join('');

    return '' +
      '<div class="modal-overlay" data-action="overlay-close">' +
        '<div class="modal">' +
          '<h2 class="serif">'+(editing?'Edit trip':'Add a trip')+'</h2>' +
          '<div class="form-row"><label>Trip name</label><input type="text" id="mf-name" placeholder="e.g. Cycle 1" value="'+(editing?escapeHtml(editing.name):'')+'"></div>' +
          '<div class="form-row"><label>Location</label><select id="mf-location">'+locOptions+'</select></div>' +
          '<div class="form-grid-2">' +
            '<div class="form-row"><label>Start date</label><input type="date" id="mf-start" value="'+(editing?editing.startDate||'':'')+'"></div>' +
            '<div class="form-row"><label>End date</label><input type="date" id="mf-end" value="'+(editing?editing.endDate||'':'')+'"></div>' +
          '</div>' +
          '<div class="form-row"><label>Currency</label><select id="mf-currency">'+curOptions+'</select></div>' +
          '<div class="form-btn-row">' +
            '<button class="btn btn-primary btn-full" data-action="save-trip">'+(editing?'Save changes':'Add trip')+'</button>' +
          '</div>' +
          '<div class="form-btn-row">' +
            '<button class="btn btn-ghost btn-full" data-action="close-modal">Cancel</button>' +
          '</div>' +
        '</div>' +
      '</div>';
  }

  function renderFab(){ return ''; }

  /* ---------- actions ---------- */
  function openAddTrip(presetLocation){
    modalState = { open:true, mode:'add', tripId:null, presetLocation: presetLocation || (currentTab!=='dashboard'?currentTab:null) };
    render();
  }
  function openEditTrip(tripId){
    modalState = { open:true, mode:'edit', tripId:tripId, presetLocation:null };
    render();
  }
  function closeModal(){
    modalState = { open:false, mode:'add', tripId:null, presetLocation:null };
    render();
  }

  function saveTripFromModal(){
    const nameEl = document.getElementById('mf-name');
    const locEl = document.getElementById('mf-location');
    const startEl = document.getElementById('mf-start');
    const endEl = document.getElementById('mf-end');
    const curEl = document.getElementById('mf-currency');

    const name = nameEl.value.trim();
    if(!name){ nameEl.focus(); return; }

    let location = locEl.value;
    if(location==='__new__'){
      const newLoc = prompt('New location name (e.g. a clinic city):');
      if(!newLoc || !newLoc.trim()){ return; }
      location = newLoc.trim();
      if(state.locations.indexOf(location)===-1) state.locations.push(location);
    }

    const currency = curEl.value;
    const startDate = startEl.value;
    const endDate = endEl.value;

    if(modalState.mode==='edit'){
      const trip = findTrip(modalState.tripId);
      trip.name = name; trip.location = location; trip.startDate = startDate; trip.endDate = endDate; trip.currency = currency;
    } else {
      state.trips.push({
        id: uid(), name: name, location: location, startDate: startDate, endDate: endDate, currency: currency,
        fixedCosts: FIXED_ITEMS.reduce(function(o,f){ o[f.key]=0; return o; }, {}),
        spending: []
      });
    }
    saveStateDebounced();
    currentTab = location;
    closeModal();
  }

  function deleteTrip(tripId){
    const trip = findTrip(tripId);
    if(!trip) return;
    if(!confirm('Delete "'+trip.name+'" and all its costs? This cannot be undone.')) return;
    state.trips = state.trips.filter(function(t){ return t.id!==tripId; });
    saveStateDebounced();
    render();
  }

  function toggleTrip(tripId){
    if(expandedTrips.has(tripId)) expandedTrips.delete(tripId);
    else expandedTrips.add(tripId);
    render();
  }

  function updateFixedCost(tripId, key, value){
    const trip = findTrip(tripId);
    if(!trip) return;
    trip.fixedCosts[key] = parseFloat(value) || 0;
    saveStateDebounced();
    const fs = document.getElementById('fixed-sub-'+tripId);
    const tt = document.getElementById('trip-total-'+tripId);
    if(fs) fs.textContent = fmt(fixedTotal(trip), trip.currency);
    if(tt) tt.textContent = fmt(tripTotal(trip), trip.currency);
  }

  function openAddSpend(tripId){
    spendUI[tripId] = { adding:true, editingId:null };
    render();
  }
  function openEditSpend(tripId, spendId){
    spendUI[tripId] = { adding:true, editingId:spendId };
    render();
  }
  function cancelSpend(tripId){
    spendUI[tripId] = { adding:false, editingId:null };
    render();
  }

  function saveSpend(tripId, spendId){
    const trip = findTrip(tripId);
    if(!trip) return;
    const card = document.getElementById('trip-'+tripId);
    const dateEl = card.querySelector('.sf-date');
    const costEl = card.querySelector('.sf-cost');
    const itemEl = card.querySelector('.sf-item');
    const catEl = card.querySelector('.sf-category');

    const date = dateEl.value || todayISO();
    const cost = parseFloat(costEl.value) || 0;
    const item = itemEl.value.trim();
    let category = catEl.value;

    if(category==='__new__'){
      const newCat = prompt('New category name:');
      if(!newCat || !newCat.trim()){ return; }
      category = newCat.trim();
      if(!categoryByName(category)){
        const color = PALETTE[state.categories.length % PALETTE.length];
        state.categories.push({name:category, color:color});
      }
    }

    if(!item){ itemEl.focus(); return; }

    if(spendId){
      const entry = trip.spending.find(function(e){ return e.id===spendId; });
      entry.date=date; entry.cost=cost; entry.item=item; entry.category=category;
    } else {
      trip.spending.push({ id: uid(), date:date, cost:cost, item:item, category:category });
    }
    saveStateDebounced();
    spendUI[tripId] = { adding:false, editingId:null };
    render();
  }

  function deleteSpend(tripId, spendId){
    const trip = findTrip(tripId);
    if(!trip) return;
    if(!confirm('Delete this entry?')) return;
    trip.spending = trip.spending.filter(function(e){ return e.id!==spendId; });
    saveStateDebounced();
    render();
  }

  function resetData(){
    if(!confirm('This will permanently delete all trips and spending data. Continue?')) return;
    state = { locations:['Belfast','Greece'], trips:[], categories: JSON.parse(JSON.stringify(DEFAULT_CATEGORIES)) };
    saveState();
    currentTab = 'dashboard';
    render();
  }

  /* ---------- event delegation ---------- */
  app.addEventListener('click', function(e){
    const el = e.target.closest('[data-action]');
    if(!el) return;
    const action = el.getAttribute('data-action');
    switch(action){
      case 'switch-tab':
        currentTab = el.getAttribute('data-tab');
        render();
        break;
      case 'open-add-trip':
        openAddTrip(el.getAttribute('data-preset-location'));
        break;
      case 'open-edit-trip':
        openEditTrip(el.getAttribute('data-trip-id'));
        break;
      case 'close-modal':
        closeModal();
        break;
      case 'overlay-close':
        if(e.target===el) closeModal();
        break;
      case 'save-trip':
        saveTripFromModal();
        break;
      case 'delete-trip':
        deleteTrip(el.getAttribute('data-trip-id'));
        break;
      case 'toggle-trip':
        toggleTrip(el.getAttribute('data-trip-id'));
        break;
      case 'add-spend-open':
        openAddSpend(el.getAttribute('data-trip-id'));
        break;
      case 'edit-spend':
        openEditSpend(el.getAttribute('data-trip-id'), el.getAttribute('data-spend-id'));
        break;
      case 'cancel-spend':
        cancelSpend(el.getAttribute('data-trip-id'));
        break;
      case 'save-spend':
        saveSpend(el.getAttribute('data-trip-id'), el.getAttribute('data-spend-id'));
        break;
      case 'delete-spend':
        deleteSpend(el.getAttribute('data-trip-id'), el.getAttribute('data-spend-id'));
        break;
      case 'reset-data':
        resetData();
        break;
    }
  });

  app.addEventListener('input', function(e){
    if(e.target.classList.contains('fixed-cost-input')){
      updateFixedCost(e.target.getAttribute('data-trip-id'), e.target.getAttribute('data-key'), e.target.value);
    }
  });

  app.addEventListener('change', function(e){
    if(e.target.id==='mf-location' && e.target.value==='__new__'){
      // handled at save time; no-op here to keep UX simple
    }
  });

  loadState();
})();
</script>
</body>
</html>
